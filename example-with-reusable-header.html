<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example with Reusable Header - Zecro Studios</title>
    <meta name="description" content="Example showing reusable header component">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Reusable header will be injected here -->
    <div id="header-container"></div>

    <main class="main-content">
        <div class="container">
            <h2>This page uses a reusable header component!</h2>
            <p>The header is injected via JavaScript, making it reusable across all pages.</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 Zecro Studios</p>
            <p>Built by Jimi Olaoya</p>
            <p>Contact: <a href="mailto:jimjatt1999@gmail.com">jimjatt1999@gmail.com</a> | GitHub: <a href="https://github.com/jimjatt1999" target="_blank" rel="noopener noreferrer">@jimjatt1999</a></p>
        </div>
    </footer>

    <!-- Load the reusable header component -->
    <script src="header.js"></script>
    <script src="script.js"></script>
</body>
</html>
