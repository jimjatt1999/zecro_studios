<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZECRO [Creative Space by Jimi Olaoya]</title>
    <meta name="description" content="Daily History. Relevant moments, every morning.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout-grid">

        <!-- Header -->
        <header class="module header-module" style="grid-column: 1 / 4;">
            <div class="brand">
                <a href="index.html">
                    <h1>ZECRO STUDIOS</h1>
                    <div class="subtitle">[creative space by jimi olaoya]</div>
                </a>
            </div>
            <div class="meta">
                <a href="index.html" class="back-link">&larr; BACK TO HOME</a>
            </div>
        </header>

        <!-- Clock Module -->
        <section class="module clock-module">
            <div class="time-display" id="tokyo-clock">
                <span id="hours">--</span>:<span id="minutes">--</span>:<span id="seconds">--</span>
            </div>
        </section>

        <!-- Location Module -->
        <section class="module location-module">
            <div class="location-text">TOKYO, JP</div>
        </section>

        <!-- App Hero -->
        <section class="module app-hero-module">
            <div class="app-info">
                <h1 class="app-title">DAILY HISTORY</h1>
                <p class="app-tagline">RELEVANT MOMENTS, EVERY MORNING.</p>
                <p class="app-desc">Fresh events every day, short and thoughtful. Explore timelines and context at a
                    glance.</p>

                <div class="app-actions">
                    <a href="https://apps.apple.com/gb/app/hi-stories/id6747240245" target="_blank"
                        class="download-btn">
                        DOWNLOAD ON APP STORE &nearr;
                    </a>
                    <a href="privacy-histories.html" class="privacy-link">PRIVACY POLICY</a>
                </div>
            </div>
        </section>

        <!-- Gallery -->
        <section class="module gallery-module">
            <div class="module-label">SCREENSHOTS</div>
            <div class="gallery-scroll">
                <img src="assets/histories/0.1.PNG" alt="Screenshot">
                <img src="assets/histories/1..PNG" alt="Screenshot">
                <img src="assets/histories/3..PNG" alt="Screenshot">
                <img src="assets/histories/4..PNG" alt="Screenshot">
                <img src="assets/histories/5..PNG" alt="Screenshot">
                <img src="assets/histories/6..PNG" alt="Screenshot">
                <img src="assets/histories/7..png" alt="Screenshot">
                <img src="assets/histories/IMG_8761.PNG" alt="Screenshot">
                <img src="assets/histories/IMG_8765.PNG" alt="Screenshot">
                <img src="assets/histories/IMG_8767.PNG" alt="Screenshot">
            </div>
        </section>

        <!-- Footer -->
        <footer class="module footer-module">
            <div class="copyright">
                &copy; 2024 JIMI OLAOYA
            </div>
        </footer>

    </div>

    <script src="main.js"></script>
</body>

</html>
