<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZECRO [Creative Space by Jimi Olaoya]</title>
    <meta name="description" content="Jimi Olaoya. Music. Electronic explorations & soundscapes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout-grid">

        <!-- Header -->
        <header class="module header-module">
            <div class="brand">
                <a href="index.html">
                    <h1>ZECRO STUDIOS</h1>
                    <div class="subtitle">[creative space by jimi olaoya]</div>
                </a>
                <span class="badge">MUSIC</span>
            </div>
            <div class="meta">
                <a href="index.html" class="back-link">&larr; BACK TO HOME</a>
            </div>
        </header>

        <!-- Music Content -->
        <!-- Music Content -->
        <section class="module full-width-module" style="padding: 0; background-color: #f2efe9;">
            <div class="tech-player" style="border: none;">

                <!-- Controller Section -->
                <div class="tech-controls-row" style="border-top: none; border-bottom: 1px solid #000000;">
                    <!-- Player Info -->
                    <div class="tech-control-panel">
                        <div class="tech-label">CONTROLLER</div>
                        <div class="tech-switch-group">
                            <div class="tech-switch">
                                <span class="tech-switch-label">POWER</span>
                                <div class="tech-switch-indicator" style="background-color: #000000;"></div>
                            </div>
                            <div class="tech-switch">
                                <span class="tech-switch-label">STEREO</span>
                                <div class="tech-switch-indicator"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Knob -->
                    <div class="tech-control-panel">
                        <div class="tech-knob-container">
                            <div class="tech-knob-arc"></div>
                            <div class="tech-knob"></div>
                        </div>
                        <div class="tech-label" style="text-align: center; margin-top: 1rem;">VOLUME</div>
                    </div>

                    <!-- Podcast/Info -->
                    <div class="tech-control-panel" style="flex: 2;">
                        <div class="tech-label">PODCAST / AUDIO</div>
                        <div class="tech-track-info">
                            <div class="tech-track-number">04</div>
                            <div class="tech-track-title">ZECRO AUDIO EXPERIENCE</div>
                            <div class="tech-track-artist">The raw audio from my creative process.</div>
                        </div>
                    </div>
                </div>

                <!-- Discography List -->
                <div class="tech-main" style="overflow-y: auto;">
                    <div class="tech-label" style="margin-bottom: 1rem;">DISCOGRAPHY SELECTS</div>

                    <div class="track-grid">
                        <!-- Embed 1 -->
                        <div class="tech-embed-wrapper">
                            <iframe style="border-radius:12px"
                                src="https://open.spotify.com/embed/track/2vwJpNxbeGKXkSj2X5NWkh?utm_source=generator"
                                width="100%" height="152" frameBorder="0" allowfullscreen=""
                                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                                loading="lazy"></iframe>
                        </div>

                        <!-- Embed 2 -->
                        <div class="tech-embed-wrapper">
                            <iframe style="border-radius:12px"
                                src="https://open.spotify.com/embed/track/0V9dJlW1lK3xfB0zpJ9uUZ?utm_source=generator"
                                width="100%" height="152" frameBorder="0" allowfullscreen=""
                                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                                loading="lazy"></iframe>
                        </div>

                        <!-- Embed 3 -->
                        <div class="tech-embed-wrapper">
                            <iframe style="border-radius:12px"
                                src="https://open.spotify.com/embed/album/5PwoN5pbwXpHq0U7ZglsXT?utm_source=generator"
                                width="100%" height="152" frameBorder="0" allowfullscreen=""
                                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                                loading="lazy"></iframe>
                        </div>

                        <!-- Embed 4 -->
                        <div class="tech-embed-wrapper">
                            <iframe style="border-radius:12px"
                                src="https://open.spotify.com/embed/album/4GCEpzAg3DpaZcUXxVvG2y?utm_source=generator"
                                width="100%" height="152" frameBorder="0" allowfullscreen=""
                                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                                loading="lazy"></iframe>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Footer -->
        <footer class="module footer-module">
            <div class="copyright">
                &copy; 2024 JIMI OLAOYA
            </div>
        </footer>

    </div>

    <script src="main.js"></script>
</body>

</html>
